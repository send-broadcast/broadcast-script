services:
  app:
    image: ${DOCKER_IMAGE:-gitea.hostedapp.org/broadcast/broadcast:latest}
    platform: linux/${TARGETARCH:-amd64}
    pull_policy: missing
    container_name: app
    restart: always
    env_file:
      - /home/replace-with-your-user/broadcast/app/.env
    volumes:
      - /home/replace-with-your-user/broadcast/app/storage:/rails/storage
      - /home/replace-with-your-user/broadcast/app/uploads:/rails/uploads
      - /home/replace-with-your-user/broadcast/logs:/rails/logs
      # Plugins: the runtime secret. The Host API listens on 3100 for the plugins container only.
      - /home/replace-with-your-user/broadcast/secrets:/run/secrets:ro
    environment:
      BROADCAST_PLUGINS_SAFE_MODE: ${BROADCAST_PLUGINS_SAFE_MODE:-0}
    ports:
      - "127.0.0.1:3000:3000" # Overrides default ports
    networks:
      - broadcast-network
      - plugins-internal
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: bin/rails server # Overrides default command

  job:
    image: ${DOCKER_IMAGE:-gitea.hostedapp.org/broadcast/broadcast:latest}
    platform: linux/${TARGETARCH:-amd64}
    pull_policy: missing
    container_name: job
    restart: always
    env_file:
      - /home/replace-with-your-user/broadcast/app/.env
    volumes:
      - /home/replace-with-your-user/broadcast/app/storage:/rails/storage
      - /home/replace-with-your-user/broadcast/secrets:/run/secrets:ro
    environment:
      BROADCAST_PLUGINS_SAFE_MODE: ${BROADCAST_PLUGINS_SAFE_MODE:-0}
    networks:
      - broadcast-network
      - plugins-internal
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "bin/jobs"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Plugins (v3, optional). Runs plugin code with only the permissions an admin approved. No
  # env_file: this container never sees app/.env, the database or the internet (only through
  # egress). It waits for the runtime secret (/home/replace-with-your-user/broadcast/secrets/plugin_runtime_secret, created by
  # install, upgrade and update); Broadcast starts without it.
  plugins:
    image: ${DOCKER_IMAGE:-gitea.hostedapp.org/broadcast/broadcast:latest}
    platform: linux/${TARGETARCH:-amd64}
    pull_policy: missing
    container_name: plugins
    restart: always
    command: ["bin/plugin-runtime"]
    environment:
      PLUGIN_HOST_API_URL: http://app:3100
      PLUGIN_EGRESS_URL: http://egress:4750
      DENO_DIR: /tmp/deno
      PLUGINS_MEMORY_LIMIT_MB: ${PLUGINS_MEMORY_LIMIT_MB:-256}
      BROADCAST_PLUGINS_SAFE_MODE: ${BROADCAST_PLUGINS_SAFE_MODE:-0}
    volumes:
      - /home/replace-with-your-user/broadcast/secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${PLUGINS_MEMORY_LIMIT_MB:-256}m
    cpus: ${PLUGINS_CPU_LIMIT:-0.5}
    pids_limit: 512
    networks:
      - plugins-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # The only way out for plugins: refuses private, metadata and the server's own addresses (set
  # BROADCAST_PUBLIC_IPS in .env) and lets each plugin process reach only its approved hosts.
  egress:
    image: ${DOCKER_IMAGE:-gitea.hostedapp.org/broadcast/broadcast:latest}
    platform: linux/${TARGETARCH:-amd64}
    pull_policy: missing
    container_name: egress
    restart: always
    command: ["sh", "-c", "until [ -s /run/secrets/plugin_runtime_secret ]; do sleep 30; done; exec broadcast-egress"]
    environment:
      PLUGIN_RUNTIME_URL: http://plugins:8787
      BROADCAST_PUBLIC_IPS: ${BROADCAST_PUBLIC_IPS:-}
    volumes:
      - /home/replace-with-your-user/broadcast/secrets:/run/secrets:ro
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    networks:
      - plugins-internal
      - plugins-egress
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    env_file:
      - /home/replace-with-your-user/broadcast/db/.env
    volumes:
      - /home/replace-with-your-user/broadcast/db/backups:/backups
      - /home/replace-with-your-user/broadcast/db/postgres-data:/var/lib/postgresql/data
      - /home/replace-with-your-user/broadcast/db/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broadcast"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - broadcast-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  broadcast-network:
    driver: bridge
  plugins-internal:
    driver: bridge
    internal: true # no internet route: plugins leave only through egress
  plugins-egress:
    driver: bridge
