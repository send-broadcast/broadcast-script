name: Upgrade dry run

# Installs the previous Broadcast release the way a customer does
# (./broadcast.sh install), fills it with the demo data, then runs the
# customer upgrade path (./broadcast.sh upgrade <new>) and checks that the
# server comes back with its data. It replaces the dry run that the demo
# server gave when it was the only box on the real installer layout.
#
# Runs on the home runner (ci-runner-home, x86), inside a fresh LXD system
# container that is deleted at the end. Never on the host itself: the
# install changes ufw, fail2ban, Docker, ports 80/443 and root cron, and the
# host also serves other orgs' runners and the production Tang key.
# The steps inside the container are tests/ci/upgrade_dry_run.sh.
#
# Started by the broadcast repo after its amd64 image build for a v* tag
# (repository_dispatch "release-image-built" with from_version/to_version),
# or by hand.
#
# Secret: BROADCAST_LICENSE_KEY, a license for the domain smoke-test.local
# (the same license as tests/smoke/.smoke-test.env).
# Host: LXD installed, the runner user in the lxd group.

on:
  repository_dispatch:
    types: [release-image-built]
  workflow_dispatch:
    inputs:
      from_version:
        description: 'Release to install first (for example 3.5.2)'
        required: true
      to_version:
        description: 'Release to upgrade to (for example 3.6.0)'
        required: true

# One container at a time: the host is shared with every other org's jobs
concurrency:
  group: upgrade-dry-run
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    env:
      FROM_VERSION: ${{ github.event.client_payload.from_version || inputs.from_version }}
      TO_VERSION: ${{ github.event.client_payload.to_version || inputs.to_version }}
      CONTAINER: upgrade-dry-run-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the versions and the host
        run: |
          for v in "$FROM_VERSION" "$TO_VERSION"; do
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "::error::'$v' is not a release version"; exit 1; }
          done
          command -v lxc >/dev/null || { echo "::error::LXD is not installed on $RUNNER_NAME"; exit 1; }
          lxc info >/dev/null || { echo "::error::the runner user cannot use LXD (add it to the lxd group)"; exit 1; }
          echo "Upgrade dry run on $RUNNER_NAME: $FROM_VERSION -> $TO_VERSION"

      - name: Start a fresh Ubuntu 24.04 container
        run: |
          lxc launch ubuntu:24.04 "$CONTAINER" \
            -c security.nesting=true \
            -c security.syscalls.intercept.mknod=true \
            -c security.syscalls.intercept.setxattr=true \
            -c limits.memory=4GiB \
            -c limits.cpu=2
          for _ in $(seq 1 60); do
            lxc exec "$CONTAINER" -- cloud-init status --wait >/dev/null 2>&1 && break
            sleep 2
          done
          lxc exec "$CONTAINER" -- getent hosts github.com >/dev/null || { echo "::error::the container has no network"; exit 1; }

      - name: Give the container the license and the script
        env:
          LICENSE: ${{ secrets.BROADCAST_LICENSE_KEY }}
        run: |
          [ -n "$LICENSE" ] || { echo "::error::The BROADCAST_LICENSE_KEY secret is not set"; exit 1; }
          printf '%s' "$LICENSE" | lxc file push --mode 0600 - "$CONTAINER/root/license"
          lxc file push --mode 0755 tests/ci/upgrade_dry_run.sh "$CONTAINER/root/upgrade_dry_run.sh"

      - name: Install ${{ env.FROM_VERSION }}, upgrade to ${{ env.TO_VERSION }}, check
        run: |
          lxc exec "$CONTAINER" -- /root/upgrade_dry_run.sh \
            "$FROM_VERSION" "$TO_VERSION" "${GITHUB_REF_NAME:-main}"

      - name: Diagnostics on failure
        if: failure()
        run: |
          lxc exec "$CONTAINER" -- docker ps -a || true
          for c in app job postgres; do
            echo "== $c"
            lxc exec "$CONTAINER" -- docker logs --tail 150 "$c" 2>&1 || true
          done
          lxc exec "$CONTAINER" -- journalctl -u broadcast --no-pager -n 100 || true

      - name: Delete the container
        if: always()
        run: lxc delete --force "$CONTAINER" || true
