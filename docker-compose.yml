services:
  app:
    image: ${DOCKER_IMAGE:-gitea.hostedapp.org/broadcast/broadcast:latest}
    platform: linux/${TARGETARCH:-amd64}
    pull_policy: missing
    container_name: app
    restart: always
    # Every in-flight request holds descriptors (the inbound socket, the proxied
    # connection, the database socket), so a traffic burst is a descriptor burst.
    # Docker's default ceiling is low enough that a webhook flood reaches it in
    # seconds. The process does not exit when it does, so the container keeps
    # reporting Running, restart: always never fires, and nothing recovers the
    # site until the container is recreated.
    #
    # Customer incident 2026-08-15: 1,253 SES webhooks in 21 seconds (~65/s)
    # exhausted the descriptors; Puma logged Errno::EMFILE from its listen loop
    # and the site served nothing but 502s for 31 minutes, while every liveness
    # signal on the box reported healthy. Reproduced by
    # tests/integration/test_descriptor_exhaustion.sh.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - /opt/broadcast/app/.env
    volumes:
      - /opt/broadcast/app/storage:/rails/storage
      - /opt/broadcast/app/uploads:/rails/uploads
      - /opt/broadcast/app/triggers:/rails/triggers
      - /opt/broadcast/app/monitor:/rails/monitor
      - /opt/broadcast/ssl:/rails/ssl
      - /opt/broadcast/logs:/rails/logs
      # Plugins: the runtime secret. The Host API listens on 3100 for the plugins container only.
      - /opt/broadcast/secrets:/run/secrets:ro
    environment:
      BROADCAST_PLUGINS_SAFE_MODE: ${BROADCAST_PLUGINS_SAFE_MODE:-0}
    ports:
      - "80:80"
      - "443:443"
    networks:
      - broadcast-network
      - plugins-internal
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      # journald survives `compose down` (json-file logs die with the
      # container); query with `journalctl CONTAINER_NAME=<name>`.
      # Retention is governed by systemd journal config, and `docker logs`
      # keeps working via Docker's default dual-logging cache.
      driver: "journald"
  job:
    image: ${DOCKER_IMAGE:-gitea.hostedapp.org/broadcast/broadcast:latest}
    platform: linux/${TARGETARCH:-amd64}
    pull_policy: missing
    container_name: job
    restart: always
    # Bulk sending opens an outbound connection per message on top of its
    # database sockets, so the worker meets the same ceiling as the app (see the
    # app service above).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - /opt/broadcast/app/.env
    volumes:
      - /opt/broadcast/app/storage:/rails/storage
      - /opt/broadcast/app/uploads:/rails/uploads
      - /opt/broadcast/secrets:/run/secrets:ro
    environment:
      BROADCAST_PLUGINS_SAFE_MODE: ${BROADCAST_PLUGINS_SAFE_MODE:-0}
    networks:
      - broadcast-network
      - plugins-internal
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "bin/jobs"
    logging:
      # journald survives `compose down` (json-file logs die with the
      # container); query with `journalctl CONTAINER_NAME=<name>`.
      # Retention is governed by systemd journal config, and `docker logs`
      # keeps working via Docker's default dual-logging cache.
      driver: "journald"
  # Plugins (v3, optional). Runs plugin code with only the permissions an admin approved. No
  # env_file: this container never sees app/.env, the database or the internet (only through
  # egress). It waits for the runtime secret (/opt/broadcast/secrets/plugin_runtime_secret, created by
  # install, upgrade and update); Broadcast starts without it.
  plugins:
    image: ${DOCKER_IMAGE:-gitea.hostedapp.org/broadcast/broadcast:latest}
    platform: linux/${TARGETARCH:-amd64}
    pull_policy: missing
    container_name: plugins
    restart: always
    command: ["bin/plugin-runtime"]
    environment:
      PLUGIN_HOST_API_URL: http://app:3100
      PLUGIN_EGRESS_URL: http://egress:4750
      DENO_DIR: /tmp/deno
      PLUGINS_MEMORY_LIMIT_MB: ${PLUGINS_MEMORY_LIMIT_MB:-256}
      BROADCAST_PLUGINS_SAFE_MODE: ${BROADCAST_PLUGINS_SAFE_MODE:-0}
    volumes:
      - /opt/broadcast/secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${PLUGINS_MEMORY_LIMIT_MB:-256}m
    cpus: ${PLUGINS_CPU_LIMIT:-0.5}
    pids_limit: 512
    networks:
      - plugins-internal
    logging:
      # journald survives `compose down`; query with `journalctl CONTAINER_NAME=<name>`.
      driver: "journald"

  # The only way out for plugins: refuses private, metadata and the server's own addresses (set
  # BROADCAST_PUBLIC_IPS in .env) and lets each plugin process reach only its approved hosts.
  egress:
    image: ${DOCKER_IMAGE:-gitea.hostedapp.org/broadcast/broadcast:latest}
    platform: linux/${TARGETARCH:-amd64}
    pull_policy: missing
    container_name: egress
    restart: always
    command: ["sh", "-c", "until [ -s /run/secrets/plugin_runtime_secret ]; do sleep 30; done; exec broadcast-egress"]
    environment:
      PLUGIN_RUNTIME_URL: http://plugins:8787
      BROADCAST_PUBLIC_IPS: ${BROADCAST_PUBLIC_IPS:-}
    volumes:
      - /opt/broadcast/secrets:/run/secrets:ro
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    networks:
      - plugins-internal
      - plugins-egress
    logging:
      # journald survives `compose down`; query with `journalctl CONTAINER_NAME=<name>`.
      driver: "journald"

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    env_file:
      - /opt/broadcast/db/.env
    volumes:
      - /opt/broadcast/db/backups:/backups
      - /opt/broadcast/db/postgres-data:/var/lib/postgresql/data
      - /opt/broadcast/db/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    # An abandoned client transaction (a GUI client left open on someone's
    # desk) holds its locks indefinitely. The migration that runs on app boot
    # then queues behind it forever, and because a pending ACCESS EXCLUSIVE
    # request also blocks every reader behind it, one idle session can wedge
    # the whole app. Reap them.
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=10min
    # Compose allows 10s before SIGKILL by default, which a shutdown
    # checkpoint on a multi-GB database can exceed. A SIGKILLed postgres does
    # WAL crash recovery on the next boot, its healthcheck stays unhealthy,
    # and `depends_on: service_healthy` leaves the app waiting — the shape of
    # a "hanging" upgrade.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broadcast"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - broadcast-network
    logging:
      # journald survives `compose down` (json-file logs die with the
      # container); query with `journalctl CONTAINER_NAME=<name>`.
      # Retention is governed by systemd journal config, and `docker logs`
      # keeps working via Docker's default dual-logging cache.
      driver: "journald"

networks:
  broadcast-network:
    driver: bridge
  plugins-internal:
    driver: bridge
    internal: true # no internet route: plugins leave only through egress
  plugins-egress:
    driver: bridge
