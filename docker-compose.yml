services:
  app:
    image: ${DOCKER_IMAGE:-gitea.hostedapp.org/broadcast/broadcast:latest}
    platform: linux/${TARGETARCH:-amd64}
    pull_policy: missing
    container_name: app
    restart: always
    env_file:
      - /opt/broadcast/app/.env
    volumes:
      - /opt/broadcast/app/storage:/rails/storage
      - /opt/broadcast/app/uploads:/rails/uploads
      - /opt/broadcast/app/triggers:/rails/triggers
      - /opt/broadcast/app/monitor:/rails/monitor
      - /opt/broadcast/ssl:/rails/ssl
      - /opt/broadcast/logs:/rails/logs
    ports:
      - "80:80"
      - "443:443"
    networks:
      - broadcast-network
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      # journald survives `compose down` (json-file logs die with the
      # container); query with `journalctl CONTAINER_NAME=<name>`.
      # Retention is governed by systemd journal config, and `docker logs`
      # keeps working via Docker's default dual-logging cache.
      driver: "journald"
  job:
    image: ${DOCKER_IMAGE:-gitea.hostedapp.org/broadcast/broadcast:latest}
    platform: linux/${TARGETARCH:-amd64}
    pull_policy: missing
    container_name: job
    restart: always
    env_file:
      - /opt/broadcast/app/.env
    volumes:
      - /opt/broadcast/app/storage:/rails/storage
      - /opt/broadcast/app/uploads:/rails/uploads
    networks:
      - broadcast-network
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "bin/jobs"
    logging:
      # journald survives `compose down` (json-file logs die with the
      # container); query with `journalctl CONTAINER_NAME=<name>`.
      # Retention is governed by systemd journal config, and `docker logs`
      # keeps working via Docker's default dual-logging cache.
      driver: "journald"
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    env_file:
      - /opt/broadcast/db/.env
    volumes:
      - /opt/broadcast/db/backups:/backups
      - /opt/broadcast/db/postgres-data:/var/lib/postgresql/data
      - /opt/broadcast/db/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    # An abandoned client transaction (a GUI client left open on someone's
    # desk) holds its locks indefinitely. The migration that runs on app boot
    # then queues behind it forever, and because a pending ACCESS EXCLUSIVE
    # request also blocks every reader behind it, one idle session can wedge
    # the whole app. Reap them.
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=10min
    # Compose allows 10s before SIGKILL by default, which a shutdown
    # checkpoint on a multi-GB database can exceed. A SIGKILLed postgres does
    # WAL crash recovery on the next boot, its healthcheck stays unhealthy,
    # and `depends_on: service_healthy` leaves the app waiting — the shape of
    # a "hanging" upgrade.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broadcast"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - broadcast-network
    logging:
      # journald survives `compose down` (json-file logs die with the
      # container); query with `journalctl CONTAINER_NAME=<name>`.
      # Retention is governed by systemd journal config, and `docker logs`
      # keeps working via Docker's default dual-logging cache.
      driver: "journald"

networks:
  broadcast-network:
    driver: bridge
